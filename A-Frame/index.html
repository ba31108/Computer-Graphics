<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Gaze Quest – Mini VR Game</title>

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script>
    let score = 0;

    function collectOrb(el) {
      if (el.getAttribute("data-collected")) return;

      el.setAttribute("data-collected", "true");
      el.setAttribute("animation", "property: scale; to: 0 0 0; dur: 400");

      score++;

      document
        .querySelector("#scoreText")
        .setAttribute("value", `Energy Orbs Collected: ${score}/3`);

      if (score === 3) {
        document
          .querySelector("#winText")
          .setAttribute("visible", true);
      }
    }

    AFRAME.registerComponent('gaze-collect', {
      init: function () {
        this.el.addEventListener('click', () => {
          collectOrb(this.el);
        });
      }
    });
  </script>
</head>

<body>
  <a-scene fog="type: exponential; density: 0.04">

    <a-entity camera look-controls position="0 1.6 0">
      <a-cursor
        fuse="true"
        fuse-timeout="1200"
        color="#FFD700"
        animation__fuse="property: scale; startEvents: fusing; to: 0.5 0.5 0.5; dur: 1200"
        animation__reset="property: scale; startEvents: mouseleave; to: 1 1 1; dur: 200">
      </a-cursor>
    </a-entity>

    <!-- ENERGY ORB 1 – PINK -->
    <a-sphere
      position="-2 2 -4"
      radius="0.35"
      color="#FF5DA2"
      emissive="#FF8FC7"
      animation="property: position; dir: alternate; dur: 2000; loop: true; to: -2 2.4 -4"
      gaze-collect>
    </a-sphere>

    <!-- ENERGY ORB 2 – PURPLE -->
    <a-sphere
      position="2 1.5 -3.5"
      radius="0.35"
      color="#6C5CE7"
      emissive="#A29BFE"
      animation="property: position; dir: alternate; dur: 1800; loop: true; to: 2 1.9 -3.5"
      gaze-collect>
    </a-sphere>

    <!-- ENERGY ORB 3 – YELLOW -->
    <a-sphere
      position="0 3 -5"
      radius="0.35"
      color="#FFD700"
      emissive="#FFF3A0"
      animation="property: position; dir: alternate; dur: 2200; loop: true; to: 0 3.5 -5"
      gaze-collect>
    </a-sphere>

    <a-plane
      position="0 3 -2.5"
      width="4"
      height="1"
      color="#FF5DA2"
      opacity="0.6">
    </a-plane>

    <a-text
      id="scoreText"
      value="Energy Orbs Collected: 0/3"
      position="0 3 -2.4"
      align="center"
      width="4"
      color="#FFFFFF">
    </a-text>

    <a-text
      id="winText"
      value="🎉 YOU WIN 🎉\nAll energy orbs collected!"
      position="0 1.8 -2"
      align="center"
      width="5"
      color="#6C5CE7"
      visible="false">
    </a-text>

    <a-sky color="#FFD700"></a-sky>

    <a-light type="ambient" intensity="0.7"></a-light>
    <a-light type="point" position="0 4 0" intensity="1.5" color="#74B9FF"></a-light>

  </a-scene>
</body>
</html>
