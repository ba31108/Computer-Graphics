<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Week 13 - Raycasting Interactions</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
        background: #0f1115;
      }

      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }

      /* UI Panel */
      #panel {
        position: absolute;
        top: 16px;
        left: 16px;
        width: 320px;
        background: rgba(20, 22, 28, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        padding: 14px;
        color: #e8e8e8;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }

      #panel h2 {
        margin: 0 0 10px 0;
        font-size: 16px;
        font-weight: bold;
      }

      #panel .hint {
        margin: 0 0 10px 0;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.7);
      }

      #info {
        font-size: 13px;
        line-height: 1.5;
        white-space: pre-wrap;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 10px;
        min-height: 120px;
      }

      #footer {
        margin-top: 10px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.55);
      }

      canvas {
        display: block;
      }
    </style>
  </head>

  <body>
    <div id="app">
      <div id="panel">
        <h2>Cube Inspector</h2>
        <p class="hint">Click a cube to see its information here.</p>
        <div id="info">No object selected.</div>
        <div id="footer">Week-13: Raycasting Interactions (Three.js)</div>
      </div>
    </div>

    <!-- Main Three.js script -->
    <script type="module" src="/main.js"></script>
  </body>
</html>
